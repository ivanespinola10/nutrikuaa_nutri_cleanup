name: Build USDA Core Food Catalog

on:
  workflow_dispatch:
  push:
    branches:
      - feature/presale-offline-plan-assistant
    paths:
      - '.github/workflows/build-official-food-catalog.yml'
      - 'tools/food_importer/import_usda.py'
      - 'tools/food_importer/nutrient_mapping.json'

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/presale-offline-plan-assistant
          fetch-depth: 0

      - name: Download USDA FoodData Central October 2026
        run: |
          rm -rf .catalog_source
          mkdir -p .catalog_source

          curl --fail --location --retry 3 \
            "https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_csv_2026-10-29.zip" \
            --output .catalog_source/usda-core.zip

          unzip -q .catalog_source/usda-core.zip \
            -d .catalog_source/extracted

      - name: Locate USDA CSV directory
        id: locate
        shell: bash
        run: |
          FOOD_FILE="$(find .catalog_source/extracted -type f -name food.csv | head -n 1)"

          if [ -z "$FOOD_FILE" ]; then
            echo "food.csv not found"
            exit 1
          fi

          INPUT_DIR="$(dirname "$FOOD_FILE")"

          echo "input_dir=$INPUT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using $INPUT_DIR"

      - name: Build Nutrikuaa USDA Core catalog
        run: |
          rm -f assets/data/nutrikuaa_foods.db
          rm -f assets/data/nutrikuaa_foods.db.manifest.json

          python3 tools/food_importer/import_usda.py \
            --input "${{ steps.locate.outputs.input_dir }}" \
            --output "assets/data/nutrikuaa_foods.db" \
            --source-release "USDA FoodData Central Core 2026-10" \
            --data-type "foundation_food" \
            --data-type "survey_fndds_food" \
            --data-type "sr_legacy_food"

      - name: Finalize bundled manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          generated = Path(
              "assets/data/nutrikuaa_foods.db.manifest.json"
          )
          target = Path(
              "assets/data/food_db_manifest.json"
          )

          data = json.loads(
              generated.read_text(encoding="utf-8")
          )

          data["bundled"] = True
          data["catalogKind"] = "usda-core"
          data["releaseDate"] = "2026-10-29"
          data["distribution"] = "bundled-offline"
          data["includedDataTypes"] = [
              "Foundation Foods 2026-10",
              "FNDDS 2021-2023",
              "SR Legacy 2018",
          ]

          target.write_text(
              json.dumps(
                  data,
                  indent=2,
                  ensure_ascii=False,
              ) + "\n",
              encoding="utf-8",
          )

          generated.unlink()
          PY

      - name: Validate generated catalog
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import sqlite3
          from pathlib import Path

          db_path = Path(
              "assets/data/nutrikuaa_foods.db"
          )

          manifest_path = Path(
              "assets/data/food_db_manifest.json"
          )

          manifest = json.loads(
              manifest_path.read_text(
                  encoding="utf-8"
              )
          )

          checksum = hashlib.sha256(
              db_path.read_bytes()
          ).hexdigest()

          if checksum != manifest["sha256"]:
              raise SystemExit(
                  "SHA-256 mismatch"
              )

          conn = sqlite3.connect(db_path)

          try:
              food_count = conn.execute(
                  "SELECT COUNT(*) FROM foods"
              ).fetchone()[0]

              nutrient_count = conn.execute(
                  "SELECT COUNT(*) FROM food_nutrients"
              ).fetchone()[0]

              portion_count = conn.execute(
                  "SELECT COUNT(*) FROM food_portions"
              ).fetchone()[0]

              energy_count = conn.execute(
                  """
                  SELECT COUNT(*)
                  FROM food_nutrients
                  WHERE nutrient_code = 'energy_kcal'
                  """
              ).fetchone()[0]

              types = conn.execute(
                  """
                  SELECT data_type, COUNT(*)
                  FROM foods
                  GROUP BY data_type
                  ORDER BY data_type
                  """
              ).fetchall()

              integrity = conn.execute(
                  "PRAGMA integrity_check"
              ).fetchone()[0]

          finally:
              conn.close()

          print("Foods:", food_count)
          print("Nutrients:", nutrient_count)
          print("Portions:", portion_count)
          print("Energy values:", energy_count)
          print("Types:", types)
          print("Integrity:", integrity)

          if integrity != "ok":
              raise SystemExit(
                  "SQLite integrity failed"
              )

          if food_count < 12000:
              raise SystemExit(
                  f"Catalog unexpectedly small: {food_count}"
              )

          if energy_count < 10000:
              raise SystemExit(
                  f"Energy coverage too small: {energy_count}"
              )

          if len(types) < 3:
              raise SystemExit(
                  f"Expected three USDA data types: {types}"
              )

          print("USDA Core catalog: OK")
          PY

      - name: Commit USDA Core catalog
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assets/data/nutrikuaa_foods.db \
            assets/data/food_db_manifest.json

          if git diff --cached --quiet; then
            echo "Catalog already current."
            exit 0
          fi

          git commit \
            -m "data(food): bundle USDA core catalog"

          git push origin \
            HEAD:feature/presale-offline-plan-assistant