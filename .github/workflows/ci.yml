name: NutriKuaa CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: nutrikuaa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare SQLite web runtime
        run: dart run tools/setup_sqlite_web.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Build web app
        run: flutter build web --release

      - name: Test offline USDA catalog builder
        run: python3 tools/food_importer/test_import_usda.py
