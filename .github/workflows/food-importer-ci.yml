name: Food Importer CI

on:
  pull_request:
    paths:
      - 'tools/food_importer/**'
      - '.github/workflows/food-importer-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/food_importer/**'
      - '.github/workflows/food-importer-ci.yml'

jobs:
  importer-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python version
        run: python3 --version

      - name: Test offline catalog builder
        run: python3 tools/food_importer/test_import_usda.py
