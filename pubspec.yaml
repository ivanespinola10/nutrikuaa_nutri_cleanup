name: nutrikuaa_app
description: "NutriKuaa Nutri, planificador nutricional local-first."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # --- ALMACENAMIENTO LOCAL ---
  shared_preferences: ^2.2.2

  # --- DOCUMENTOS Y PDF ---
  pdf: ^3.10.4
  printing: ^5.11.0
  file_selector: ^1.1.0
  cryptography: ^2.9.0

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # --- BASE DE DATOS Y ARCHIVOS ---
  sqflite: ^2.4.1
  sqflite_common_ffi_web: 1.0.2
  sqlite3: 2.9.4
  path: ^1.9.0
  csv: ^6.0.0

  # Firebase is used only by the closed tester access gate.
  # Patient records and plans remain in the local database.
  # --- UI ---
  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: 2.3.7+1

# --- CONFIGURACIÓN DE FLUTTER ---
flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/data/

dependency_overrides:
  sqflite_android: 2.4.0